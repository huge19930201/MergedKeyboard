name: Build MergedKeyboard (arm64e)

# 推送或在 GitHub 网页手动触发即可自动编译出 arm64e/arm64 的 .deb
# 同时产出两种越狱方案：
#   - rootless : Dopamine / XinaA15 / palera1n(rootless) 等（/var/jb）
#   - roothide : Dopamine RootHide 版（.jbroot）
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # theos-action 需要 macOS 或 Linux runner（不支持 Windows）
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scheme: [ rootless, roothide ]

    name: Build (${{ matrix.scheme }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (toolchain + iOS SDK)
        uses: Randomblock1/theos-action@v1
        with:
          # 默认从 theos/sdks 拉取最新 iPhoneOS SDK（当前 16.5）
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Show Theos version
        run: |
          echo "THEOS: $THEOS"
          if [ -f "$THEOS/vendor/libroothide/libroothide.h" ]; then echo "roothide 支持: 有"; else echo "roothide 支持: 未找到 libroothide"; fi

      - name: Build package (${{ matrix.scheme }})
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          mkdir -p out
          cp packages/*.deb out/ || true
          ls -la out/

      - name: Upload .deb artifact (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: MergedKeyboard-arm64e-${{ matrix.scheme }}
          path: out/*.deb
          if-no-files-found: error

      # （可选）打 tag 时自动发布到 Release
      - name: Release on tag (${{ matrix.scheme }})
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb
