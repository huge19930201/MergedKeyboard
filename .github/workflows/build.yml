name: Build MergedKeyboard (arm64e)

# 推送或在 GitHub 网页手动触发即可自动编译出 arm64e/arm64 的 .deb
# 同时产出两种越狱方案：
#   - rootless : Dopamine / XinaA15 / palera1n(rootless) 等（/var/jb）
#   - roothide : Dopamine RootHide 版（.jbroot）
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # theos-action 需要 macOS 或 Linux runner（不支持 Windows）
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scheme: [ rootless, roothide ]

    name: Build (${{ matrix.scheme }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (toolchain + iOS SDK)
        uses: Randomblock1/theos-action@v1
        with:
          # 默认从 theos/sdks 拉取最新 iPhoneOS SDK（当前 16.5）
          theos-sdks: 'https://github.com/theos/sdks'

      # theos-action 自带的 theos 可能过旧，不支持 roothide scheme，这里强制更新到最新 master
      - name: Update Theos to latest master
        run: |
          set -e
          echo "THEOS=$THEOS"
          cp -r "$THEOS/sdks" /tmp/theos-sdks-backup 2>/dev/null || true
          if [ -d "$THEOS/.git" ]; then
            git -C "$THEOS" fetch --all --tags --prune || true
            git -C "$THEOS" reset --hard origin/HEAD || git -C "$THEOS" reset --hard origin/master || true
            git -C "$THEOS" submodule update --init --recursive || true
          else
            rm -rf "$THEOS"
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          mkdir -p "$THEOS/sdks"
          cp -r /tmp/theos-sdks-backup/. "$THEOS/sdks/" 2>/dev/null || true
          echo "--- SDK ---"; ls "$THEOS/sdks"
          echo "--- version ---"; git -C "$THEOS" log -1 --oneline || true
          echo "--- roothide 支持 ---"
          if [ -f "$THEOS/vendor/libroothide/libroothide.h" ]; then echo "有 libroothide"; else echo "缺少 libroothide"; ls "$THEOS/vendor" || true; fi
          grep -n "roothide" "$THEOS/makefiles/common.mk" | head -20 || true

      - name: Build package (${{ matrix.scheme }})
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          mkdir -p out
          cp packages/*.deb out/ || true
          ls -la out/

      - name: Upload .deb artifact (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: MergedKeyboard-arm64e-${{ matrix.scheme }}
          path: out/*.deb
          if-no-files-found: error

      # （可选）打 tag 时自动发布到 Release
      - name: Release on tag (${{ matrix.scheme }})
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb
