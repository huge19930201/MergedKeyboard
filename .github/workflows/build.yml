name: Build MergedKeyboard (arm64e)

# 推送或在 GitHub 网页手动触发即可自动编译出 arm64e/arm64 的 .deb
# 同时产出两种越狱方案：
#   - rootless : Dopamine / XinaA15 / palera1n(rootless) 等（/var/jb）  -> 官方 theos
#   - roothide : Dopamine RootHide 版（.jbroot）                        -> roothide/theos
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # theos-action 需要 macOS 或 Linux runner（不支持 Windows）
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scheme: [ rootless, roothide ]

    name: Build (${{ matrix.scheme }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (toolchain + iOS SDK)
        uses: Randomblock1/theos-action@v1
        with:
          # 默认从 theos/sdks 拉取最新 iPhoneOS SDK（当前 16.5）
          theos-sdks: 'https://github.com/theos/sdks'

      # RootHide 的打包 scheme 只存在于 roothide/theos 里，官方 theos 没有
      - name: Swap in roothide/theos (roothide only)
        if: matrix.scheme == 'roothide'
        run: |
          set -e
          echo "原 THEOS=$THEOS"
          mv "$THEOS" /tmp/theos-official
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks" "$THEOS/toolchain"
          cp -a /tmp/theos-official/sdks/. "$THEOS/sdks/" 2>/dev/null || true
          cp -a /tmp/theos-official/toolchain/. "$THEOS/toolchain/" 2>/dev/null || true
          echo "--- sdks ---"; ls "$THEOS/sdks"
          echo "--- 可用 scheme ---"; ls "$THEOS/vendor/mod"
          echo "--- roothide scheme 内容 ---"; ls "$THEOS/vendor/mod/roothide"

      - name: Build package (${{ matrix.scheme }})
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          mkdir -p out
          cp packages/*.deb out/ || true
          ls -la out/

      - name: Upload .deb artifact (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: MergedKeyboard-arm64e-${{ matrix.scheme }}
          path: out/*.deb
          if-no-files-found: error

      # （可选）打 tag 时自动发布到 Release
      - name: Release on tag (${{ matrix.scheme }})
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb
