name: Build MergedKeyboard (arm64e)

# 推送或在 GitHub 网页手动触发即可自动编译出 rootless 的 arm64e/arm64 .deb
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # theos-action 需要 macOS 或 Linux runner（不支持 Windows）
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (toolchain + iOS SDK)
        uses: Randomblock1/theos-action@v1
        with:
          # 默认从 theos/sdks 拉取最新 iPhoneOS SDK（当前 16.5）
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Build package (arm64e)
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: MergedKeyboard-arm64e-rootless
          # rootless 方案产物在 packages/ 下
          path: packages/*.deb
          if-no-files-found: error

      # （可选）打 tag 时自动发布到 Release
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
